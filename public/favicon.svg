<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RNGdle Unlocked">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f1412"/>
      <stop offset="1" stop-color="#1a2e28"/>
    </linearGradient>
    <linearGradient id="glow" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="digit" x1="20" y1="18" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#glow)" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Slot / number card -->
  <rect x="12" y="14" width="40" height="28" rx="6" fill="#0a1210" stroke="url(#glow)" stroke-width="1.75"/>
  <rect x="15" y="17" width="34" height="22" rx="4" fill="#11201c"/>

  <!-- Digit windows -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="url(#digit)" text-anchor="middle" dominant-baseline="central">
    <text x="22.5" y="28.5">7</text>
    <text x="32" y="28.5">?</text>
    <text x="41.5" y="28.5">3</text>
  </g>
  <path d="M26.5 18.5v19M37.5 18.5v19" stroke="#1f3d35" stroke-width="1"/>

  <!-- Unlock shackle -->
  <g filter="url(#soft)">
    <path d="M38 40.5c0-3.2 2.4-5.5 5.5-5.5S49 37.3 49 40.5V44" fill="none" stroke="url(#glow)" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="35.5" y="43" width="16" height="11" rx="3" fill="url(#glow)"/>
    <circle cx="43.5" cy="48" r="1.6" fill="#042f2e"/>
    <path d="M43.5 49.4v2.2" stroke="#042f2e" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Spark -->
  <circle cx="17" cy="48" r="1.4" fill="#5eead4" opacity="0.9"/>
  <circle cx="21.5" cy="51.5" r="0.9" fill="#a7f3d0" opacity="0.75"/>
</svg>
